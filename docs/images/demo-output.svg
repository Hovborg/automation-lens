<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="817" viewBox="0 0 1600 817" role="img" aria-labelledby="title desc" font-family="Consolas,monospace">
<title id="title">Automation Lens — actual output from fictional demo data</title>
<desc id="desc">Command line report generated by the program using the bundled synthetic example. Potential conflicts must be checked against actual conditions.</desc>
<rect width="1600" height="817" rx="16" fill="#091723"/>
<path d="M0 65h1600" stroke="#2a4251"/>
<g><circle cx="31" cy="31" r="7" fill="#df7373"/><circle cx="55" cy="31" r="7" fill="#e8bd65"/><circle cx="79" cy="31" r="7" fill="#5fbb9f"/></g>
<text x="112" y="38" fill="#91aebd" font-size="18">AUTOMATION LENS / SYNTHETIC DEMO</text>
<text x="36" y="97" fill="#69dae7" font-size="19">$ automation-lens --data-dir examples/demo --findings --severity warning</text>
<text x="36" y="132" fill="#d6e6ed" font-size="20">  Automation Lens   5 automations · 3 referenced entities · 3 known entities</text><text x="36" y="159" fill="#f3c56e" font-size="20">  ▲ 4 warning</text><text x="36" y="186" fill="#65dbe7" font-size="20">  DELAY TRAP  ×1</text><text x="36" y="213" fill="#d6e6ed" font-size="20">  ──────────────────────────────────────────────────────────────────────────</text><text x="36" y="240" fill="#f3c56e" font-size="20">  ▲ Demo - single-mode timer may remain active for up to 5 min</text><text x="36" y="267" fill="#d6e6ed" font-size="20">      mode: single, longest run: 5 min</text><text x="36" y="294" fill="#d6e6ed" font-size="20">      triggered by: binary_sensor.demo_motion *→on</text><text x="36" y="321" fill="#f3c56e" font-size="20">      triggers during that window are silently dropped (only a warning is logged)</text><text x="36" y="348" fill="#65dbe7" font-size="20">  MISSING REFERENCE  ×1</text><text x="36" y="375" fill="#d6e6ed" font-size="20">  ──────────────────────────────────────────────────────────────────────────</text><text x="36" y="402" fill="#f3c56e" font-size="20">  ▲ Demo - retired lamp reference references 1 item missing from this snapshot</text><text x="36" y="429" fill="#d6e6ed" font-size="20">      light.turn_on → light.demo_retired</text><text x="36" y="456" fill="#65dbe7" font-size="20">  FEEDBACK LOOP  ×1</text><text x="36" y="483" fill="#d6e6ed" font-size="20">  ──────────────────────────────────────────────────────────────────────────</text><text x="36" y="510" fill="#f3c56e" font-size="20">  ▲ Potential feedback loop between 2 automations (all use single mode, which may limit repeated runs)</text><text x="36" y="537" fill="#d6e6ed" font-size="20">      Demo - relay follows lamp  ──[switch.demo_relay]──▶  Demo - relay switches lamp off</text><text x="36" y="564" fill="#d6e6ed" font-size="20">      Demo - relay switches lamp off  ──[light.demo_lamp]──▶  Demo - relay follows lamp</text><text x="36" y="591" fill="#65dbe7" font-size="20">  CONFLICTING WRITE  ×1</text><text x="36" y="618" fill="#d6e6ed" font-size="20">  ──────────────────────────────────────────────────────────────────────────</text><text x="36" y="645" fill="#f3c56e" font-size="20">  ▲ Two automations may push light.demo_lamp in opposite directions</text><text x="36" y="672" fill="#d6e6ed" font-size="20">      Demo - motion lights lamp  (all day)</text><text x="36" y="699" fill="#d6e6ed" font-size="20">          turn on → light.demo_lamp</text><text x="36" y="726" fill="#d6e6ed" font-size="20">      Demo - single-mode timer  (all day)</text><text x="36" y="753" fill="#d6e6ed" font-size="20">          turn off → light.demo_lamp</text><text x="36" y="780" fill="#d6e6ed" font-size="20">      both are triggered by: binary_sensor.demo_motion  ← the same event may match both</text></svg>