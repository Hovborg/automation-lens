name: Bug report
description: Report a reproducible Automation Lens problem using fictional data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use only a minimal synthetic example. Do not attach Home Assistant exports, tokens, traces, private URLs, entity registries, household names, locations, or real automation files. Revoke a token immediately if it was exposed.
  - type: input
    id: version
    attributes:
      label: Automation Lens version or commit
      placeholder: "Release number or Git commit"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version` or the virtual environment's Python.
      placeholder: "Python 3.x.x"
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command area
      options:
        - Findings
        - Explain
        - Chain
        - Simulate
        - Fetch
        - JSON output
        - Installation or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the exact command with fictional paths and values.
      placeholder: |
        1. Create the minimal synthetic files under `demo-case/`.
        2. Run `automation-lens --data-dir demo-case --findings`.
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic configuration
      description: Paste only the fictional YAML or JSON needed to reproduce the problem.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste sanitized output. Findings are leads, so explain which relationship appears incorrect.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used fictional entities and removed tokens, private addresses, identifiers, locations, names, and household routines.
          required: true
        - label: This report does not contain a real Home Assistant export, trace, registry, automation, script, or JSON findings file.
          required: true
